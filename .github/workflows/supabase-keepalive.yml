name: Supabase keep-alive

# Query ringan tiap hari biar project Supabase Free (Mesin / vwhbkhzfhwpjlqiojtfj) tidak kena auto-pause 7 hari.
# Setup secrets di GitHub: Settings > Secrets and variables > Actions
#   SUPABASE_URL      = https://vwhbkhzfhwpjlqiojtfj.supabase.co
#   SUPABASE_ANON_KEY = anon public key dari halaman yang sama

on:
  schedule:
    - cron: "37 2 * * *" # tiap hari 09:37 WIB
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query ringan ke tabel news_history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL atau SUPABASE_ANON_KEY belum diset di GitHub Secrets"
            exit 1
          fi
          echo "Ping $SUPABASE_URL/rest/v1/news_history ..."
          curl -sf -o /dev/null -w "news_history: %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/news_history?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo "Keep-alive OK"
          echo "Keep-alive OK"